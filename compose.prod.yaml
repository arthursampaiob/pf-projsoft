name: pf-projsoft

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: tarefas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tarefas"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: pf-projsoft:latest
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "8082:8081"
    environment:
      SERVER_PORT: 8081
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tarefas
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: